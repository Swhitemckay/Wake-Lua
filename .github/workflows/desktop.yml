name: Desktop installers

on:
  push:
    branches: [main]
    paths:
      - 'wake-lua-*-source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest source archive
        id: project
        shell: bash
        run: |
          source_zip="$(find . -maxdepth 1 -type f -name 'wake-lua-*-source.zip' -print | sed 's|^\./||' | sort -V | tail -n 1)"
          test -n "$source_zip"
          version="${source_zip#wake-lua-}"
          version="${version%-source.zip}"
          directory="source/wake-lua-${version}"
          mkdir -p source
          unzip -q "$source_zip" -d source
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.project.outputs.directory }}/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.directory }}
        run: pnpm install --frozen-lockfile
      - name: Build installer
        working-directory: ${{ steps.project.outputs.directory }}
        run: pnpm run desktop:${{ matrix.target }}
      - name: Verify Mac disk image and app signature
        if: matrix.target == 'mac'
        shell: bash
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          app='release/desktop/mac-universal/Wake Lua.app'
          dmg=$(find release/desktop -maxdepth 1 -name '*universal.dmg' -print -quit)
          test -d "$app" && test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          archs=$(lipo -archs "$app/Contents/MacOS/Wake Lua")
          [[ " $archs " == *' x86_64 '* && " $archs " == *' arm64 '* ]]
          hdiutil verify "$dmg"
      - name: Install and launch Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          $installer = (Get-ChildItem release/desktop/*.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'WakeLua'
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exit code: $($install.ExitCode)" }
          $app = Join-Path $installDir 'Wake Lua.exe'
          if (!(Test-Path $app)) { throw "Installed app is missing: $app" }
          $running = Start-Process -FilePath $app -PassThru
          try {
            Start-Sleep -Seconds 12
            $running.Refresh()
            if ($running.HasExited) { throw "Wake Lua exited with code $($running.ExitCode)" }
          } finally {
            if (!$running.HasExited) { Stop-Process -Id $running.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Wake-Lua-${{ matrix.target }}
          path: |
            ${{ steps.project.outputs.directory }}/release/desktop/*.dmg
            ${{ steps.project.outputs.directory }}/release/desktop/*.exe
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest source archive
        id: project
        shell: bash
        run: |
          source_zip="$(find . -maxdepth 1 -type f -name 'wake-lua-*-source.zip' -print | sed 's|^\./||' | sort -V | tail -n 1)"
          test -n "$source_zip"
          version="${source_zip#wake-lua-}"
          version="${version%-source.zip}"
          directory="source/wake-lua-${version}"
          mkdir -p source
          unzip -q "$source_zip" -d source
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: Wake-Lua-*
          path: release/desktop
          merge-multiple: true
      - name: Prepare release downloads
        shell: bash
        run: |
          windows_file=$(find release/desktop -maxdepth 1 -name '*.exe' -print -quit)
          mac_file=$(find release/desktop -maxdepth 1 -iname '*universal.dmg' -print -quit)
          test -n "$windows_file" && test -n "$mac_file"
          mkdir -p release/assets
          cp "$windows_file" release/assets/Wake-Lua-Windows.exe
          cp "$mac_file" release/assets/Wake-Lua-Mac.dmg
      - name: Publish versioned downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.project.outputs.version }}
          name: Wake Lua ${{ steps.project.outputs.version }}
          body: |-
            Windows and Mac installers for Wake Lua.

            Windows uses x64. The universal Mac download supports Apple Silicon and Intel.

            These installers are unsigned. On macOS, approve the app in System Settings > Privacy & Security after the first open attempt.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: release/assets/*
